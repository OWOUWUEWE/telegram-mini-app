<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6d72f5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Друзья | Мессенджер</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Reset & Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #6d72f5;
            --primary-dark: #575cd6;
            --secondary: #2dd4bf;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #0a0a0f;
            --surface: #151520;
            --surface-light: #1e1e2d;
            --text: #ffffff;
            --text-muted: #a0a0c0;
            --border: #2a2a3d;
            --radius: 12px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
            --safe-area: env(safe-area-inset-bottom, 20px);
        }

        html {
            font-size: 14px;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.4;
            height: 100%;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* App Container */
        #app {
            height: 100vh;
            height: -webkit-fill-available;
            display: flex;
            flex-direction: column;
            max-width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        /* Auth Screen */
        .auth-screen {
            background: linear-gradient(135deg, var(--bg) 0%, #151525 100%);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }

        .auth-screen.hidden {
            display: none;
        }

        .logo {
            font-size: 3.5rem;
            color: var(--primary);
            margin-bottom: 30px;
        }

        .app-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .app-subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 50px;
            max-width: 300px;
        }

        .auth-buttons {
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            padding: 18px 24px;
            border-radius: var(--radius);
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: var(--shadow);
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-mini {
            background: #2a2a3d;
            color: #a0a0c0;
            font-size: 1rem;
            padding: 14px 20px;
            margin-top: 30px;
        }

        /* Main App */
        .app-screen {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .app-screen.active {
            display: flex;
        }

        /* Top Bar */
        .top-bar {
            background: var(--surface);
            padding: 16px 20px;
            padding-top: max(16px, env(safe-area-inset-top));
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .top-bar-title {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .top-bar-actions {
            display: flex;
            gap: 16px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--surface-light);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            cursor: pointer;
            transition: background 0.2s;
        }

        .icon-btn:active {
            background: var(--primary);
        }

        .badge {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 8px;
            height: 8px;
            background: var(--danger);
            border-radius: 50%;
        }

        /* Tab Bar */
        .tab-bar {
            display: flex;
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 12px 0;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
        }

        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
            padding: 8px 0;
        }

        .tab-item.active {
            color: var(--primary);
        }

        .tab-icon {
            font-size: 1.3rem;
        }

        .tab-label {
            font-size: 0.85rem;
            font-weight: 500;
        }

        /* Tab Content */
        .tab-content {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .tab-pane {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0;
            opacity: 0;
            transform: translateX(20px);
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
        }

        .tab-pane.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: all;
        }

        /* Chats List */
        .chats-list {
            padding: 0;
        }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
        }

        .chat-item:active {
            background: var(--surface-light);
        }

        .chat-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1.2rem;
            color: white;
            position: relative;
        }

        .chat-status {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid var(--surface);
            background: var(--success);
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .chat-name {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .chat-time {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .chat-preview {
            color: var(--text-muted);
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-unread {
            background: var(--primary);
            color: white;
            font-size: 0.85rem;
            padding: 2px 8px;
            border-radius: 12px;
            min-width: 20px;
            text-align: center;
        }

        /* Friends List */
        .friends-list {
            padding: 20px;
        }

        .friend-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 0;
        }

        .friend-actions {
            display: flex;
            gap: 12px;
            margin-left: auto;
        }

        .action-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--surface-light);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            cursor: pointer;
        }

        .add-friend-btn {
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            z-index: 100;
        }

        /* Chat Screen */
        .chat-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .chat-screen.active {
            transform: translateX(0);
        }

        .chat-header-bar {
            background: var(--surface);
            padding: 16px 20px;
            padding-top: max(16px, env(safe-area-inset-top));
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid var(--border);
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--surface-light);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 85%;
            animation: messageAppear 0.2s ease;
        }

        @keyframes messageAppear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-incoming {
            align-self: flex-start;
        }

        .message-outgoing {
            align-self: flex-end;
        }

        .message-bubble {
            background: var(--surface);
            border-radius: 18px;
            padding: 12px 16px;
            font-size: 1rem;
            line-height: 1.4;
        }

        .message-outgoing .message-bubble {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        }

        .message-time {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
            text-align: right;
        }

        .message-outgoing .message-time {
            color: rgba(255, 255, 255, 0.7);
        }

        .chat-input-area {
            padding: 12px 20px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .message-input {
            flex: 1;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 12px 18px;
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
            resize: none;
            max-height: 120px;
            min-height: 44px;
            line-height: 1.4;
        }

        .message-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            flex-shrink: 0;
        }

        .send-btn:active {
            background: var(--primary-dark);
        }

        .send-btn:disabled {
            background: var(--border);
            cursor: not-allowed;
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 24px;
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal.active .modal-content {
            transform: translateY(0);
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 1.1rem;
            color: var(--text-muted);
        }

        .loading:before {
            content: '';
            width: 24px;
            height: 24px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty States */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 3rem;
            color: var(--border);
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 8px 16px;
            background: var(--surface-light);
            border-radius: 18px;
            max-width: fit-content;
            margin-bottom: 8px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typing {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
        }

        /* Profile */
        .profile-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            padding: 40px 20px;
            text-align: center;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: white;
            margin: 0 auto 20px;
            border: 4px solid rgba(255, 255, 255, 0.2);
        }

        .profile-name {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .profile-status {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        /* Optimizations for mobile */
        @media (max-width: 480px) {
            html {
                font-size: 13px;
            }
            
            .chat-avatar {
                width: 48px;
                height: 48px;
                font-size: 1.1rem;
            }
            
            .message {
                max-width: 90%;
            }
        }

        /* Dark/light mode support */
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f8f9fa;
                --surface: #ffffff;
                --surface-light: #f1f3f5;
                --text: #212529;
                --text-muted: #6c757d;
                --border: #dee2e6;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Авторизация -->
        <div class="auth-screen" id="auth-screen">
            <div class="logo">
                <i class="fas fa-comments"></i>
            </div>
            <h1 class="app-title">Друзья</h1>
            <p class="app-subtitle">Быстрый мессенджер для общения с друзьями</p>
            
            <div class="auth-buttons">
                <button class="btn btn-primary" id="btn-vk">
                    <i class="fab fa-vk"></i>
                    Войти через ВКонтакте
                </button>
                <button class="btn btn-primary" id="btn-telegram">
                    <i class="fab fa-telegram"></i>
                    Войти через Telegram
                </button>
                <button class="btn btn-secondary" id="btn-phone">
                    <i class="fas fa-phone"></i>
                    Войти по номеру
                </button>
                
                <button class="btn btn-mini" id="btn-guest">
                    <i class="fas fa-user"></i>
                    Продолжить как гость
                </button>
            </div>
            
            <p style="margin-top: 40px; color: var(--text-muted); font-size: 0.9rem;">
                Нажимая "Войти", вы принимаете условия использования
            </p>
        </div>

        <!-- Основное приложение -->
        <div class="app-screen" id="app-screen">
            <!-- Верхняя панель -->
            <div class="top-bar">
                <div class="top-bar-title" id="current-tab-title">Чаты</div>
                <div class="top-bar-actions">
                    <div class="icon-btn" id="btn-search">
                        <i class="fas fa-search"></i>
                    </div>
                    <div class="icon-btn" id="btn-profile">
                        <i class="fas fa-user"></i>
                    </div>
                </div>
            </div>

            <!-- Контент вкладок -->
            <div class="tab-content">
                <!-- Вкладка чатов -->
                <div class="tab-pane active" id="tab-chats">
                    <div class="chats-list" id="chats-list">
                        <!-- Чаты загружаются динамически -->
                    </div>
                </div>

                <!-- Вкладка друзей -->
                <div class="tab-pane" id="tab-friends">
                    <div class="friends-list" id="friends-list">
                        <!-- Друзья загружаются динамически -->
                    </div>
                    <div class="add-friend-btn" id="btn-add-friend">
                        <i class="fas fa-user-plus"></i>
                    </div>
                </div>

                <!-- Вкладка звонков -->
                <div class="tab-pane" id="tab-calls">
                    <div class="empty-state">
                        <div class="empty-icon">
                            <i class="fas fa-phone"></i>
                        </div>
                        <h3>История звонков</h3>
                        <p>Начните общение с друзьями</p>
                    </div>
                </div>
            </div>

            <!-- Нижняя панель вкладок -->
            <div class="tab-bar">
                <div class="tab-item active" data-tab="chats">
                    <div class="tab-icon">
                        <i class="fas fa-comment-alt"></i>
                    </div>
                    <div class="tab-label">Чаты</div>
                </div>
                <div class="tab-item" data-tab="friends">
                    <div class="tab-icon">
                        <i class="fas fa-user-friends"></i>
                    </div>
                    <div class="tab-label">Друзья</div>
                </div>
                <div class="tab-item" data-tab="calls">
                    <div class="tab-icon">
                        <i class="fas fa-phone"></i>
                    </div>
                    <div class="tab-label">Звонки</div>
                </div>
            </div>
        </div>

        <!-- Экран чата -->
        <div class="chat-screen" id="chat-screen">
            <div class="chat-header-bar">
                <div class="back-btn" id="btn-back-chat">
                    <i class="fas fa-arrow-left"></i>
                </div>
                <div class="chat-avatar" id="chat-avatar">
                    <span>Д</span>
                    <div class="chat-status" id="chat-status"></div>
                </div>
                <div style="flex: 1;">
                    <div class="chat-name" id="chat-name">Друг</div>
                    <div class="chat-preview" id="chat-online">В сети</div>
                </div>
                <div class="icon-btn" id="btn-call">
                    <i class="fas fa-phone"></i>
                </div>
                <div class="icon-btn" id="btn-video">
                    <i class="fas fa-video"></i>
                </div>
            </div>

            <div class="chat-messages" id="chat-messages">
                <!-- Сообщения загружаются динамически -->
            </div>

            <div class="chat-input-area">
                <textarea 
                    class="message-input" 
                    id="message-input"
                    placeholder="Сообщение..."
                    rows="1"
                ></textarea>
                <button class="send-btn" id="btn-send">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>

        <!-- Модальные окна -->
        <!-- Добавление друга -->
        <div class="modal" id="modal-add-friend">
            <div class="modal-content">
                <h3 class="modal-title">Добавить друга</h3>
                <div class="form-group">
                    <input type="text" class="form-input" id="friend-code" placeholder="Код друга или @username">
                </div>
                <div class="modal-actions">
                    <button class="btn btn-secondary" style="flex: 1;" id="btn-cancel-add">Отмена</button>
                    <button class="btn btn-primary" style="flex: 1;" id="btn-add">Добавить</button>
                </div>
            </div>
        </div>

        <!-- Профиль -->
        <div class="modal" id="modal-profile">
            <div class="modal-content">
                <div class="profile-header">
                    <div class="profile-avatar" id="profile-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="profile-name" id="profile-name">Пользователь</div>
                    <div class="profile-status" id="profile-status">В сети</div>
                </div>
                
                <div style="padding: 24px;">
                    <div class="form-group">
                        <label style="display: block; margin-bottom: 8px; color: var(--text-muted);">Ваш код:</label>
                        <input type="text" class="form-input" id="user-code" readonly>
                    </div>
                    
                    <button class="btn btn-secondary" style="width: 100%; margin-top: 16px;" id="btn-edit-profile">
                        <i class="fas fa-edit"></i> Редактировать профиль
                    </button>
                    
                    <button class="btn btn-secondary" style="width: 100%; margin-top: 12px;" id="btn-settings">
                        <i class="fas fa-cog"></i> Настройки
                    </button>
                    
                    <button class="btn" style="width: 100%; margin-top: 24px; background: var(--surface-light); color: var(--danger);" id="btn-logout">
                        <i class="fas fa-sign-out-alt"></i> Выйти
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== ИНИЦИАЛИЗАЦИЯ ====================
        const APP_KEY = 'friends_messenger';
        let currentUser = null;
        let currentChat = null;
        let friends = [];
        let chats = [];
        let messages = {};

        // Инициализация приложения
        function initApp() {
            loadData();
            setupEventListeners();
            checkAuth();
            setupMobileOptimizations();
        }

        // Загрузка данных из localStorage
        function loadData() {
            const saved = localStorage.getItem(APP_KEY);
            if (saved) {
                const data = JSON.parse(saved);
                currentUser = data.currentUser || null;
                friends = data.friends || [];
                chats = data.chats || [];
                messages = data.messages || {};
            } else {
                // Создаем демо-данные для гостя
                createDemoData();
            }
        }

        // Сохранение данных
        function saveData() {
            const data = {
                currentUser,
                friends,
                chats,
                messages,
                lastSave: Date.now()
            };
            localStorage.setItem(APP_KEY, JSON.stringify(data));
        }

        // Создание демо-данных
        function createDemoData() {
            currentUser = {
                id: 'user_' + Date.now(),
                name: 'Гость',
                avatar: 'Г',
                code: '@guest_' + Math.random().toString(36).substr(2, 6),
                status: 'online'
            };

            friends = [
                {
                    id: 'friend_1',
                    name: 'Алексей',
                    avatar: 'А',
                    code: '@alexey',
                    status: 'online',
                    lastSeen: Date.now()
                },
                {
                    id: 'friend_2',
                    name: 'Мария',
                    avatar: 'М',
                    code: '@maria',
                    status: 'online',
                    lastSeen: Date.now() - 300000
                },
                {
                    id: 'friend_3',
                    name: 'Дмитрий',
                    avatar: 'Д',
                    code: '@dmitry',
                    status: 'offline',
                    lastSeen: Date.now() - 3600000
                }
            ];

            chats = [
                {
                    id: 'chat_1',
                    friendId: 'friend_1',
                    lastMessage: 'Привет! Как дела?',
                    lastTime: Date.now(),
                    unread: 2
                },
                {
                    id: 'chat_2',
                    friendId: 'friend_2',
                    lastMessage: 'Посмотри это видео!',
                    lastTime: Date.now() - 1800000,
                    unread: 0
                }
            ];

            messages = {
                chat_1: [
                    {
                        id: 'msg_1',
                        sender: 'friend_1',
                        text: 'Привет! Как дела?',
                        time: Date.now() - 3600000,
                        type: 'incoming'
                    },
                    {
                        id: 'msg_2',
                        sender: 'user',
                        text: 'Привет! Всё отлично, спасибо!',
                        time: Date.now() - 3500000,
                        type: 'outgoing'
                    },
                    {
                        id: 'msg_3',
                        sender: 'friend_1',
                        text: 'Отлично! Давай в пятницу встретимся?',
                        time: Date.now() - 3400000,
                        type: 'incoming'
                    }
                ],
                chat_2: [
                    {
                        id: 'msg_4',
                        sender: 'friend_2',
                        text: 'Посмотри это видео!',
                        time: Date.now() - 2000000,
                        type: 'incoming'
                    }
                ]
            };

            saveData();
        }

        // ==================== АВТОРИЗАЦИЯ ====================
        function checkAuth() {
            if (currentUser) {
                showApp();
            } else {
                showAuth();
            }
        }

        function showAuth() {
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('app-screen').classList.remove('active');
        }

        function showApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.add('active');
            renderChats();
            renderFriends();
            updateProfile();
        }

        // Эмуляция входа через мини-приложение
        function loginWithVK() {
            currentUser = {
                id: 'vk_' + Date.now(),
                name: 'Пользователь ВК',
                avatar: 'В',
                code: '@vk_' + Math.random().toString(36).substr(2, 8),
                status: 'online'
            };
            saveData();
            showApp();
            showNotification('Вход через ВКонтакте выполнен');
        }

        function loginWithTelegram() {
            currentUser = {
                id: 'tg_' + Date.now(),
                name: 'Пользователь Telegram',
                avatar: 'Т',
                code: '@tg_' + Math.random().toString(36).substr(2, 8),
                status: 'online'
            };
            saveData();
            showApp();
            showNotification('Вход через Telegram выполнен');
        }

        function loginWithPhone() {
            currentUser = {
                id: 'phone_' + Date.now(),
                name: 'Пользователь',
                avatar: 'П',
                code: '@phone_' + Math.random().toString(36).substr(2, 8),
                status: 'online'
            };
            saveData();
            showApp();
            showNotification('Вход по номеру выполнен');
        }

        function loginAsGuest() {
            createDemoData();
            showApp();
            showNotification('Вы вошли как гость');
        }

        // ==================== ОТОБРАЖЕНИЕ ДАННЫХ ====================
        function renderChats() {
            const container = document.getElementById('chats-list');
            container.innerHTML = '';

            if (chats.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">
                            <i class="fas fa-comment-alt"></i>
                        </div>
                        <h3>Нет чатов</h3>
                        <p>Начните общение с друзьями</p>
                    </div>
                `;
                return;
            }

            chats.forEach(chat => {
                const friend = friends.find(f => f.id === chat.friendId);
                if (!friend) return;

                const time = formatTime(chat.lastTime);
                const unread = chat.unread > 0 ? `<div class="chat-unread">${chat.unread}</div>` : '';

                const chatEl = document.createElement('div');
                chatEl.className = 'chat-item';
                chatEl.dataset.chatId = chat.id;
                
                chatEl.innerHTML = `
                    <div class="chat-avatar" style="background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);">
                        ${friend.avatar}
                        <div class="chat-status status-${friend.status}"></div>
                    </div>
                    <div class="chat-info">
                        <div class="chat-header">
                            <div class="chat-name">${friend.name}</div>
                            <div class="chat-time">${time}</div>
                        </div>
                        <div class="chat-preview">${chat.lastMessage}</div>
                    </div>
                    ${unread}
                `;

                chatEl.addEventListener('click', () => openChat(chat.id));
                container.appendChild(chatEl);
            });
        }

        function renderFriends() {
            const container = document.getElementById('friends-list');
            container.innerHTML = '';

            friends.forEach(friend => {
                const lastSeen = formatLastSeen(friend.lastSeen);
                const statusText = friend.status === 'online' ? 'В сети' : lastSeen;

                const friendEl = document.createElement('div');
                friendEl.className = 'friend-item';
                
                friendEl.innerHTML = `
                    <div class="chat-avatar" style="background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);">
                        ${friend.avatar}
                        <div class="chat-status status-${friend.status}"></div>
                    </div>
                    <div class="chat-info">
                        <div class="chat-header">
                            <div class="chat-name">${friend.name}</div>
                        </div>
                        <div class="chat-preview">${statusText}</div>
                    </div>
                    <div class="friend-actions">
                        <div class="action-btn" data-action="message" data-friend-id="${friend.id}">
                            <i class="fas fa-comment"></i>
                        </div>
                        <div class="action-btn" data-action="call" data-friend-id="${friend.id}">
                            <i class="fas fa-phone"></i>
                        </div>
                    </div>
                `;

                container.appendChild(friendEl);
            });

            // Добавляем обработчики действий
            document.querySelectorAll('[data-action="message"]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const friendId = e.currentTarget.dataset.friendId;
                    startChatWithFriend(friendId);
                });
            });

            document.querySelectorAll('[data-action="call"]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const friendId = e.currentTarget.dataset.friendId;
                    startCall(friendId);
                });
            });
        }

        function openChat(chatId) {
            const chat = chats.find(c => c.id === chatId);
            if (!chat) return;

            const friend = friends.find(f => f.id === chat.friendId);
            if (!friend) return;

            currentChat = chatId;
            
            // Обновляем заголовок чата
            document.getElementById('chat-avatar').innerHTML = `
                ${friend.avatar}
                <div class="chat-status status-${friend.status}"></div>
            `;
            document.getElementById('chat-name').textContent = friend.name;
            document.getElementById('chat-online').textContent = 
                friend.status === 'online' ? 'В сети' : formatLastSeen(friend.lastSeen);
            
            // Показываем экран чата
            document.getElementById('chat-screen').classList.add('active');
            
            // Загружаем сообщения
            renderMessages();
            
            // Сбрасываем непрочитанные
            chat.unread = 0;
            saveData();
            renderChats();
        }

        function renderMessages() {
            const container = document.getElementById('chat-messages');
            const chatMessages = messages[currentChat] || [];
            
            container.innerHTML = '';
            
            chatMessages.forEach(msg => {
                const messageEl = document.createElement('div');
                messageEl.className = `message message-${msg.type}`;
                
                const time = formatTime(msg.time);
                const friend = friends.find(f => f.id === msg.sender) || currentUser;
                
                messageEl.innerHTML = `
                    <div class="message-bubble">${msg.text}</div>
                    <div class="message-time">${time}</div>
                `;
                
                container.appendChild(messageEl);
            });
            
            // Прокручиваем вниз
            setTimeout(() => {
                container.scrollTop = container.scrollHeight;
            }, 100);
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            
            if (!text) return;
            
            // Создаем сообщение
            const newMessage = {
                id: 'msg_' + Date.now(),
                sender: currentUser.id,
                text: text,
                time: Date.now(),
                type: 'outgoing'
            };
            
            // Добавляем в чат
            if (!messages[currentChat]) {
                messages[currentChat] = [];
            }
            messages[currentChat].push(newMessage);
            
            // Обновляем информацию о чате
            const chat = chats.find(c => c.id === currentChat);
            if (chat) {
                chat.lastMessage = text;
                chat.lastTime = Date.now();
            }
            
            // Сохраняем и обновляем
            saveData();
            renderMessages();
            renderChats();
            
            // Очищаем поле ввода
            input.value = '';
            input.style.height = 'auto';
            
            // Эмуляция ответа друга через 1-3 секунды
            const friend = friends.find(f => f.id === chat.friendId);
            if (friend && friend.status === 'online') {
                setTimeout(() => {
                    const responses = [
                        'Привет!',
                        'Интересно!',
                        'Согласен с тобой',
                        'Давай обсудим подробнее',
                        'Хорошо 👍',
                        'Спасибо за сообщение!'
                    ];
                    
                    const response = responses[Math.floor(Math.random() * responses.length)];
                    
                    const replyMessage = {
                        id: 'msg_' + Date.now(),
                        sender: friend.id,
                        text: response,
                        time: Date.now(),
                        type: 'incoming'
                    };
                    
                    messages[currentChat].push(replyMessage);
                    chat.lastMessage = response;
                    chat.lastTime = Date.now();
                    
                    saveData();
                    renderMessages();
                    renderChats();
                }, 1000 + Math.random() * 2000);
            }
        }

        // ==================== ДРУЗЬЯ ====================
        function addFriend(code) {
            if (!code.trim()) {
                showNotification('Введите код друга');
                return;
            }
            
            // Проверяем, не добавлен ли уже друг
            const existingFriend = friends.find(f => f.code === code);
            if (existingFriend) {
                showNotification('Этот друг уже добавлен');
                return;
            }
            
            // Эмуляция добавления друга
            const newFriend = {
                id: 'friend_' + Date.now(),
                name: 'Друг ' + code.substr(0, 6),
                avatar: 'Д',
                code: code,
                status: 'online',
                lastSeen: Date.now()
            };
            
            friends.push(newFriend);
            
            // Создаем чат с новым другом
            const newChat = {
                id: 'chat_' + Date.now(),
                friendId: newFriend.id,
                lastMessage: 'Начните общение!',
                lastTime: Date.now(),
                unread: 0
            };
            
            chats.push(newChat);
            messages[newChat.id] = [];
            
            saveData();
            renderFriends();
            renderChats();
            
            showNotification('Друг добавлен!');
            hideModal('modal-add-friend');
        }

        function startChatWithFriend(friendId) {
            let chat = chats.find(c => c.friendId === friendId);
            
            if (!chat) {
                // Создаем новый чат
                chat = {
                    id: 'chat_' + Date.now(),
                    friendId: friendId,
                    lastMessage: 'Начните общение!',
                    lastTime: Date.now(),
                    unread: 0
                };
                
                chats.push(chat);
                messages[chat.id] = [];
                saveData();
                renderChats();
            }
            
            openChat(chat.id);
        }

        // ==================== ЗВОНКИ ====================
        function startCall(friendId) {
            const friend = friends.find(f => f.id === friendId);
            if (!friend) return;
            
            showNotification(`Начинаем звонок с ${friend.name}...`);
            
            // В реальном приложении здесь была бы логика WebRTC
            setTimeout(() => {
                showNotification(`${friend.name} не отвечает`, 'warning');
            }, 5000);
        }

        // ==================== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ====================
        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            
            if (diff < 3600000) { // Менее часа
                const minutes = Math.floor(diff / 60000);
                return minutes < 1 ? 'только что' : `${minutes} мин назад`;
            } else if (diff < 86400000) { // Менее суток
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } else {
                return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
            }
        }

        function formatLastSeen(timestamp) {
            const diff = Date.now() - timestamp;
            
            if (diff < 60000) return 'только что';
            if (diff < 3600000) return `${Math.floor(diff / 60000)} мин назад`;
            if (diff < 86400000) return `${Math.floor(diff / 3600000)} ч назад`;
            return `${Math.floor(diff / 86400000)} дн назад`;
        }

        function showNotification(text, type = 'info') {
            // Создаем уведомление
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                left: 20px;
                right: 20px;
                background: ${type === 'error' ? 'var(--danger)' : type === 'warning' ? 'var(--warning)' : 'var(--primary)'};
                color: white;
                padding: 16px;
                border-radius: var(--radius);
                text-align: center;
                z-index: 3000;
                animation: slideIn 0.3s ease;
                box-shadow: var(--shadow);
            `;
            
            notification.textContent = text;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        function showModal(modalId) {
            document.getElementById(modalId).classList.add('active');
        }

        function hideModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function updateProfile() {
            if (!currentUser) return;
            
            document.getElementById('profile-avatar').innerHTML = currentUser.avatar;
            document.getElementById('profile-name').textContent = currentUser.name;
            document.getElementById('profile-status').textContent = 
                currentUser.status === 'online' ? 'В сети' : 'Не в сети';
            document.getElementById('user-code').value = currentUser.code;
        }

        // ==================== ОПТИМИЗАЦИИ ДЛЯ МОБИЛЬНЫХ ====================
        function setupMobileOptimizations() {
            // Предотвращаем зум при двойном тапе
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                const now = Date.now();
                if (now - lastTouchEnd <= 300) {
                    event.preventDefault();
                }
                lastTouchEnd = now;
            }, false);

            // Фиксируем высоту viewport на iOS
            function setVH() {
                const vh = window.innerHeight * 0.01;
                document.documentElement.style.setProperty('--vh', `${vh}px`);
            }
            
            window.addEventListener('resize', setVH);
            window.addEventListener('orientationchange', setVH);
            setVH();

            // Обработка клавиатуры
            const messageInput = document.getElementById('message-input');
            messageInput.addEventListener('focus', function() {
                setTimeout(() => {
                    document.getElementById('chat-messages').scrollTop = 
                        document.getElementById('chat-messages').scrollHeight;
                }, 300);
            });
        }

        // ==================== ОБРАБОТЧИКИ СОБЫТИЙ ====================
        function setupEventListeners() {
            // Авторизация
            document.getElementById('btn-vk').addEventListener('click', loginWithVK);
            document.getElementById('btn-telegram').addEventListener('click', loginWithTelegram);
            document.getElementById('btn-phone').addEventListener('click', loginWithPhone);
            document.getElementById('btn-guest').addEventListener('click', loginAsGuest);
            
            // Вкладки
            document.querySelectorAll('.tab-item').forEach(tab => {
                tab.addEventListener('click', function() {
                    const tabId = this.dataset.tab;
                    
                    // Обновляем активные вкладки
                    document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    
                    document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
                    document.getElementById('tab-' + tabId).classList.add('active');
                    
                    document.getElementById('current-tab-title').textContent = 
                        tabId === 'chats' ? 'Чаты' :
                        tabId === 'friends' ? 'Друзья' : 'Звонки';
                });
            });
            
            // Кнопки в верхней панели
            document.getElementById('btn-search').addEventListener('click', () => {
                showNotification('Поиск временно недоступен');
            });
            
            document.getElementById('btn-profile').addEventListener('click', () => {
                updateProfile();
                showModal('modal-profile');
            });
            
            // Добавление друга
            document.getElementById('btn-add-friend').addEventListener('click', () => {
                showModal('modal-add-friend');
            });
            
            document.getElementById('btn-add').addEventListener('click', () => {
                const code = document.getElementById('friend-code').value;
                addFriend(code);
                document.getElementById('friend-code').value = '';
            });
            
            document.getElementById('btn-cancel-add').addEventListener('click', () => {
                hideModal('modal-add-friend');
                document.getElementById('friend-code').value = '';
            });
            
            // Чат
            document.getElementById('btn-back-chat').addEventListener('click', () => {
                document.getElementById('chat-screen').classList.remove('active');
                currentChat = null;
            });
            
            document.getElementById('btn-send').addEventListener('click', sendMessage);
            
            document.getElementById('message-input').addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            });
            
            document.getElementById('message-input').addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            
            // Звонки в чате
            document.getElementById('btn-call').addEventListener('click', () => {
                if (currentChat) {
                    const chat = chats.find(c => c.id === currentChat);
                    if (chat) {
                        startCall(chat.friendId);
                    }
                }
            });
            
            document.getElementById('btn-video').addEventListener('click', () => {
                showNotification('Видеозвонки скоро появятся!');
            });
            
            // Профиль
            document.getElementById('btn-logout').addEventListener('click', () => {
                currentUser = null;
                saveData();
                showAuth();
                hideModal('modal-profile');
                showNotification('Вы вышли из аккаунта');
            });
            
            document.getElementById('btn-edit-profile').addEventListener('click', () => {
                hideModal('modal-profile');
                setTimeout(() => {
                    showNotification('Редактирование профиля скоро появится!');
                }, 300);
            });
            
            document.getElementById('btn-settings').addEventListener('click', () => {
                hideModal('modal-profile');
                setTimeout(() => {
                    showNotification('Настройки скоро появятся!');
                }, 300);
            });
            
            // Закрытие модальных окон
            document.querySelectorAll('.modal').forEach(modal => {
                modal.addEventListener('click', function(e) {
                    if (e.target === this) {
                        hideModal(this.id);
                    }
                });
            });
        }

        // Запуск приложения
        document.addEventListener('DOMContentLoaded', initApp);
        
        // Добавляем стили для анимаций уведомлений
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from {
                    transform: translateY(-100px);
                    opacity: 0;
                }
                to {
                    transform: translateY(0);
                    opacity: 1;
                }
            }
            
            @keyframes slideOut {
                from {
                    transform: translateY(0);
                    opacity: 1;
                }
                to {
                    transform: translateY(-100px);
                    opacity: 0;
                }
            }
            
            .status-online { background: var(--success); }
            .status-offline { background: var(--text-muted); }
            .status-idle { background: var(--warning); }
            .status-dnd { background: var(--danger); }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
