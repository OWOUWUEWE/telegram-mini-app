<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6d72f5">
    <title>Realtime Messenger | Живой чат</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6d72f5;
            --primary-dark: #575cd6;
            --secondary: #2dd4bf;
            --danger: #ef4444;
            --success: #10b981;
            --bg: #0a0a0f;
            --surface: #151520;
            --surface-light: #1e1e2d;
            --text: #ffffff;
            --text-muted: #a0a0c0;
            --border: #2a2a3d;
            --radius: 12px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.4;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        /* Auth Screen */
        .auth-screen {
            background: linear-gradient(135deg, var(--bg) 0%, #151525 100%);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }

        .logo {
            font-size: 3.5rem;
            color: var(--primary);
            margin-bottom: 30px;
        }

        .app-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .app-subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 30px;
            max-width: 300px;
        }

        .login-box {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            padding: 16px 24px;
            border-radius: var(--radius);
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: var(--shadow);
        }

        .user-selector {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .user-option {
            padding: 16px;
            background: var(--surface-light);
            border-radius: 8px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-option:hover {
            border-color: var(--primary);
        }

        .user-option.active {
            border-color: var(--primary);
            background: var(--surface);
        }

        .user-avatar-small {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: white;
            font-size: 1.2rem;
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .user-id {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Main App */
        .main-screen {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .main-screen.active {
            display: flex;
        }

        /* Top Bar */
        .top-bar {
            background: var(--surface);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .top-bar-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: white;
            font-size: 1.2rem;
        }

        .user-info {
            flex: 1;
        }

        .current-user-name {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .current-user-status {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .top-bar-actions {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--surface-light);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            cursor: pointer;
        }

        /* Contacts List */
        .contacts-container {
            flex: 1;
            overflow-y: auto;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
        }

        .contact-item:hover {
            background: var(--surface);
        }

        .contact-item.active {
            background: var(--surface);
            border-left: 3px solid var(--primary);
        }

        .contact-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: white;
            position: relative;
        }

        .contact-status {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid var(--surface);
            background: var(--success);
        }

        .contact-status.offline {
            background: var(--text-muted);
        }

        .contact-details {
            flex: 1;
        }

        .contact-name {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .contact-last {
            color: var(--text-muted);
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-unread {
            background: var(--primary);
            color: white;
            font-size: 0.85rem;
            padding: 2px 8px;
            border-radius: 12px;
            min-width: 20px;
            text-align: center;
        }

        /* Chat Screen */
        .chat-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .chat-screen.active {
            transform: translateX(0);
        }

        .chat-header {
            background: var(--surface);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid var(--border);
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--surface-light);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 85%;
            animation: messageAppear 0.2s ease;
        }

        @keyframes messageAppear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-incoming {
            align-self: flex-start;
        }

        .message-outgoing {
            align-self: flex-end;
        }

        .message-bubble {
            background: var(--surface);
            border-radius: 18px;
            padding: 12px 16px;
            font-size: 1rem;
            line-height: 1.4;
        }

        .message-outgoing .message-bubble {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        }

        .message-time {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
            text-align: right;
        }

        .message-outgoing .message-time {
            color: rgba(255, 255, 255, 0.7);
        }

        .chat-input {
            padding: 12px 20px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .message-input {
            flex: 1;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 12px 18px;
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
            resize: none;
            max-height: 120px;
            min-height: 44px;
            line-height: 1.4;
        }

        .message-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            flex-shrink: 0;
        }

        .send-btn:disabled {
            background: var(--border);
            cursor: not-allowed;
        }

        /* Call Screen */
        .call-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            z-index: 2000;
            display: none;
            flex-direction: column;
        }

        .call-screen.active {
            display: flex;
        }

        .call-header {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
        }

        .call-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .call-status {
            font-size: 1.1rem;
            font-weight: 500;
        }

        .call-timer {
            font-family: monospace;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .video-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
            background: #000;
            position: relative;
        }

        .remote-video {
            flex: 1;
            background: var(--surface);
            object-fit: cover;
        }

        .local-video {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 120px;
            height: 160px;
            border-radius: 8px;
            border: 2px solid white;
            object-fit: cover;
            background: var(--surface);
        }

        .call-controls {
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            background: rgba(0, 0, 0, 0.7);
        }

        .call-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            border: none;
            font-size: 1.5rem;
        }

        .call-btn.end-call {
            background: var(--danger);
        }

        .call-btn.muted {
            background: var(--danger);
        }

        .call-btn.active {
            background: var(--success);
        }

        /* Incoming Call */
        .incoming-call {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 3000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }

        .incoming-call.active {
            display: flex;
        }

        .caller-info {
            margin-bottom: 40px;
            color: white;
        }

        .caller-name {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .caller-status {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .call-actions {
            display: flex;
            gap: 30px;
        }

        .accept-call {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--success);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
        }

        .decline-call {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--danger);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 24px;
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 1.1rem;
            color: var(--text-muted);
        }

        .loading:before {
            content: '';
            width: 24px;
            height: 24px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty States */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 3rem;
            color: var(--border);
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* Notification */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            max-width: 320px;
            z-index: 3000;
            transform: translateX(100%);
            opacity: 0;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
        }

        .notification.show {
            transform: translateX(0);
            opacity: 1;
        }

        /* Mobile Optimizations */
        @media (max-width: 480px) {
            .chat-messages {
                padding: 16px;
            }
            
            .message {
                max-width: 90%;
            }
            
            .contact-item {
                padding: 14px 16px;
            }
            
            .local-video {
                width: 100px;
                height: 133px;
            }
            
            .call-btn {
                width: 50px;
                height: 50px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Авторизация -->
        <div class="auth-screen" id="auth-screen">
            <div class="logo">
                <i class="fas fa-comments"></i>
            </div>
            <h1 class="app-title">RealChat</h1>
            <p class="app-subtitle">Настоящие сообщения между пользователями</p>
            
            <div class="login-box">
                <div class="form-group">
                    <label class="form-label">Ваше имя</label>
                    <input type="text" class="form-input" id="username" placeholder="Введите ваше имя" maxlength="20">
                </div>
                
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">
                    Выберите пользователя для входа:
                </p>
                
                <div class="user-selector" id="user-selector">
                    <!-- Пользователи загружаются динамически -->
                </div>
                
                <button class="btn btn-primary" id="btn-login" style="margin-top: 24px;">
                    <i class="fas fa-sign-in-alt"></i>
                    Войти в чат
                </button>
                
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 20px;">
                    Откройте две вкладки с разными пользователями для тестирования чата
                </p>
            </div>
        </div>

        <!-- Основной экран -->
        <div class="main-screen" id="main-screen">
            <!-- Верхняя панель -->
            <div class="top-bar">
                <div class="top-bar-info">
                    <div class="user-avatar" id="current-user-avatar">А</div>
                    <div class="user-info">
                        <div class="current-user-name" id="current-user-name">Алексей</div>
                        <div class="current-user-status" id="current-user-status">В сети</div>
                    </div>
                </div>
                
                <div class="top-bar-actions">
                    <div class="icon-btn" id="btn-refresh">
                        <i class="fas fa-sync-alt"></i>
                    </div>
                    <div class="icon-btn" id="btn-new-chat">
                        <i class="fas fa-edit"></i>
                    </div>
                    <div class="icon-btn" id="btn-logout">
                        <i class="fas fa-sign-out-alt"></i>
                    </div>
                </div>
            </div>

            <!-- Список контактов -->
            <div class="contacts-container" id="contacts-list">
                <!-- Контакты загружаются динамически -->
            </div>
        </div>

        <!-- Экран чата -->
        <div class="chat-screen" id="chat-screen">
            <div class="chat-header">
                <div class="back-btn" id="btn-back">
                    <i class="fas fa-arrow-left"></i>
                </div>
                <div class="user-avatar" id="chat-user-avatar">М</div>
                <div style="flex: 1;">
                    <div class="current-user-name" id="chat-user-name">Мария</div>
                    <div class="current-user-status" id="chat-user-status">В сети</div>
                </div>
                <div class="icon-btn" id="btn-call">
                    <i class="fas fa-phone"></i>
                </div>
            </div>

            <div class="chat-messages" id="chat-messages">
                <!-- Сообщения загружаются динамически -->
            </div>

            <div class="chat-input">
                <textarea 
                    class="message-input" 
                    id="message-input"
                    placeholder="Напишите сообщение..."
                    rows="1"
                ></textarea>
                <button class="send-btn" id="btn-send">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>

        <!-- Экран звонка -->
        <div class="call-screen" id="call-screen">
            <div class="call-header">
                <div class="call-info">
                    <div class="user-avatar" id="call-avatar">М</div>
                    <div>
                        <div class="current-user-name" id="call-name">Мария</div>
                        <div class="call-status" id="call-status">Идет звонок...</div>
                    </div>
                </div>
                <div class="call-timer" id="call-timer">00:00</div>
            </div>
            
            <div class="video-container">
                <video id="remoteVideo" class="remote-video" autoplay playsinline></video>
                <video id="localVideo" class="local-video" autoplay playsinline muted></video>
            </div>
            
            <div class="call-controls">
                <button class="call-btn" id="btn-mute">
                    <i class="fas fa-microphone"></i>
                </button>
                <button class="call-btn" id="btn-video">
                    <i class="fas fa-video"></i>
                </button>
                <button class="call-btn end-call" id="btn-end-call">
                    <i class="fas fa-phone-slash"></i>
                </button>
            </div>
        </div>

        <!-- Входящий звонок -->
        <div class="incoming-call" id="incoming-call">
            <div class="caller-info">
                <div class="user-avatar" id="incoming-avatar" style="width: 80px; height: 80px; font-size: 2rem; margin: 0 auto 20px;">М</div>
                <div class="caller-name" id="incoming-name">Мария</div>
                <div class="caller-status" id="incoming-status">Входящий звонок...</div>
            </div>
            
            <div class="call-actions">
                <div class="accept-call" id="btn-accept-call">
                    <i class="fas fa-phone"></i>
                </div>
                <div class="decline-call" id="btn-decline-call">
                    <i class="fas fa-phone-slash"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Уведомление -->
    <div class="notification" id="notification">
        <div style="display: flex; align-items: center; gap: 12px;">
            <div class="user-avatar" id="notification-avatar" style="width: 36px; height: 36px; font-size: 1rem;">А</div>
            <div style="flex: 1;">
                <div style="font-weight: 600;" id="notification-title">Новое сообщение</div>
                <div style="font-size: 0.9rem; color: var(--text-muted);" id="notification-text">От Алексей</div>
            </div>
        </div>
    </div>

    <script>
        // ==================== СИСТЕМА РЕАЛЬНЫХ СООБЩЕНИЙ ====================
        const STORAGE_KEY = 'messenger_data_v2';
        const CALL_EVENTS_KEY = 'call_events';
        const SYNC_INTERVAL = 1000;
        
        let currentUser = null;
        let currentChat = null;
        let currentContact = null;
        let allUsers = {};
        let allMessages = {};
        let callData = {
            isInitiator: false,
            callId: null,
            peerConnection: null,
            localStream: null,
            callTimer: null,
            callStartTime: null,
            isMuted: false,
            isVideoOff: false
        };
        
        // Инициализация пользователей
        function initUsers() {
            return {
                'user_1': {
                    id: 'user_1',
                    name: 'Алексей',
                    avatar: 'А',
                    color: '#6d72f5',
                    status: 'online',
                    lastSeen: Date.now()
                },
                'user_2': {
                    id: 'user_2',
                    name: 'Мария',
                    avatar: 'М',
                    color: '#f472b6',
                    status: 'online',
                    lastSeen: Date.now()
                },
                'user_3': {
                    id: 'user_3',
                    name: 'Дмитрий',
                    avatar: 'Д',
                    color: '#2dd4bf',
                    status: 'offline',
                    lastSeen: Date.now() - 3600000
                },
                'user_4': {
                    id: 'user_4',
                    name: 'Елена',
                    avatar: 'Е',
                    color: '#f59e0b',
                    status: 'online',
                    lastSeen: Date.now()
                }
            };
        }
        
        // Инициализация приложения
        function initApp() {
            loadData();
            setupEventListeners();
            setupStorageSync();
            renderUserSelector();
            checkAuth();
        }
        
        // Загрузка данных
        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const data = JSON.parse(saved);
                allUsers = data.allUsers || initUsers();
                allMessages = data.allMessages || {};
            } else {
                allUsers = initUsers();
                allMessages = {};
                saveData();
            }
        }
        
        // Сохранение данных
        function saveData() {
            const data = {
                allUsers,
                allMessages,
                lastUpdate: Date.now()
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            window.dispatchEvent(new Event('storageUpdated'));
        }
        
        // Синхронизация между вкладками
        function setupStorageSync() {
            window.addEventListener('storage', (e) => {
                if (e.key === STORAGE_KEY) {
                    loadData();
                    updateUI();
                    showNotification('Данные обновлены');
                }
                if (e.key === CALL_EVENTS_KEY) {
                    handleCallEvent();
                }
            });
            
            window.addEventListener('storageUpdated', () => {
                loadData();
                updateUI();
            });
            
            setInterval(() => {
                loadData();
                updateUI();
            }, SYNC_INTERVAL);
        }
        
        // Обновление интерфейса
        function updateUI() {
            if (currentUser) {
                renderContacts();
                if (currentChat) {
                    renderMessages();
                }
            }
        }
        
        // ==================== АВТОРИЗАЦИЯ ====================
        function renderUserSelector() {
            const container = document.getElementById('user-selector');
            container.innerHTML = '';
            
            Object.values(allUsers).forEach(user => {
                const userEl = document.createElement('div');
                userEl.className = 'user-option';
                userEl.dataset.userId = user.id;
                
                userEl.innerHTML = `
                    <div class="user-avatar-small" style="background: linear-gradient(135deg, ${user.color} 0%, ${user.color}99 100%);">
                        ${user.avatar}
                    </div>
                    <div class="user-info">
                        <div class="user-name">${user.name}</div>
                        <div class="user-id">ID: ${user.id}</div>
                    </div>
                `;
                
                userEl.addEventListener('click', function() {
                    document.querySelectorAll('.user-option').forEach(o => o.classList.remove('active'));
                    this.classList.add('active');
                    document.getElementById('username').value = user.name;
                });
                
                container.appendChild(userEl);
            });
            
            // Выбираем первого пользователя по умолчанию
            const firstUser = document.querySelector('.user-option');
            if (firstUser) {
                firstUser.classList.add('active');
                document.getElementById('username').value = Object.values(allUsers)[0].name;
            }
        }
        
        function checkAuth() {
            const savedUser = localStorage.getItem('current_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                showMainScreen();
            }
        }
        
        function login() {
            const selected = document.querySelector('.user-option.active');
            if (!selected) {
                showError('Выберите пользователя');
                return;
            }
            
            const userId = selected.dataset.userId;
            const username = document.getElementById('username').value.trim() || allUsers[userId].name;
            
            // Обновляем пользователя
            currentUser = {
                ...allUsers[userId],
                name: username,
                lastSeen: Date.now(),
                status: 'online'
            };
            
            // Обновляем в общем списке
            allUsers[userId] = currentUser;
            
            // Сохраняем
            localStorage.setItem('current_user', JSON.stringify(currentUser));
            saveData();
            
            showMainScreen();
            showNotification(`Добро пожаловать, ${currentUser.name}!`);
        }
        
        function logout() {
            if (currentUser) {
                allUsers[currentUser.id].status = 'offline';
                saveData();
            }
            
            localStorage.removeItem('current_user');
            currentUser = null;
            currentChat = null;
            
            document.getElementById('main-screen').classList.remove('active');
            document.getElementById('auth-screen').style.display = 'flex';
            document.getElementById('chat-screen').classList.remove('active');
            
            showNotification('Вы вышли из системы');
        }
        
        function showMainScreen() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-screen').classList.add('active');
            
            document.getElementById('current-user-avatar').textContent = currentUser.avatar;
            document.getElementById('current-user-avatar').style.background = `linear-gradient(135deg, ${currentUser.color} 0%, ${currentUser.color}99 100%)`;
            document.getElementById('current-user-name').textContent = currentUser.name;
            document.getElementById('current-user-status').textContent = 'В сети';
            
            renderContacts();
        }
        
        // ==================== КОНТАКТЫ И ЧАТ ====================
        function renderContacts() {
            const container = document.getElementById('contacts-list');
            container.innerHTML = '';
            
            const otherUsers = Object.values(allUsers).filter(user => user.id !== currentUser.id);
            
            if (otherUsers.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">
                            <i class="fas fa-user-friends"></i>
                        </div>
                        <h3>Нет контактов</h3>
                        <p>Добавьте друзей для общения</p>
                    </div>
                `;
                return;
            }
            
            otherUsers.forEach(user => {
                const chatId = getChatId(currentUser.id, user.id);
                const messages = allMessages[chatId] || [];
                const lastMessage = messages[messages.length - 1];
                const unread = messages.filter(m => 
                    m.senderId === user.id && !m.read
                ).length;
                
                const contactEl = document.createElement('div');
                contactEl.className = `contact-item ${currentContact?.id === user.id ? 'active' : ''}`;
                contactEl.dataset.userId = user.id;
                
                const lastMessageText = lastMessage ? 
                    (lastMessage.senderId === currentUser.id ? `Вы: ${lastMessage.text}` : lastMessage.text) : 
                    'Нет сообщений';
                
                const lastMessageTime = lastMessage ? formatTime(lastMessage.timestamp) : '';
                
                contactEl.innerHTML = `
                    <div class="contact-avatar" style="background: linear-gradient(135deg, ${user.color} 0%, ${user.color}99 100%);">
                        ${user.avatar}
                        <div class="contact-status ${user.status === 'online' ? '' : 'offline'}"></div>
                    </div>
                    <div class="contact-details">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div class="contact-name">${user.name}</div>
                            <div style="font-size: 0.85rem; color: var(--text-muted);">${lastMessageTime}</div>
                        </div>
                        <div class="contact-last">${lastMessageText}</div>
                    </div>
                    ${unread > 0 ? `<div class="contact-unread">${unread}</div>` : ''}
                `;
                
                contactEl.addEventListener('click', () => openChat(user));
                container.appendChild(contactEl);
            });
        }
        
        function openChat(user) {
            currentContact = user;
            currentChat = getChatId(currentUser.id, user.id);
            
            document.getElementById('chat-user-avatar').textContent = user.avatar;
            document.getElementById('chat-user-avatar').style.background = `linear-gradient(135deg, ${user.color} 0%, ${user.color}99 100%)`;
            document.getElementById('chat-user-name').textContent = user.name;
            document.getElementById('chat-user-status').textContent = user.status === 'online' ? 'В сети' : 'Не в сети';
            
            document.getElementById('chat-screen').classList.add('active');
            
            markMessagesAsRead();
            renderMessages();
            renderContacts();
        }
        
        function renderMessages() {
            const container = document.getElementById('chat-messages');
            const messages = allMessages[currentChat] || [];
            
            container.innerHTML = '';
            
            if (messages.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">
                            <i class="fas fa-comments"></i>
                        </div>
                        <h3>Начните общение</h3>
                        <p>Отправьте первое сообщение!</p>
                    </div>
                `;
                return;
            }
            
            let lastDate = null;
            
            messages.forEach((msg, index) => {
                const messageDate = new Date(msg.timestamp).toDateString();
                
                if (messageDate !== lastDate) {
                    const dateEl = document.createElement('div');
                    dateEl.className = 'system-message';
                    dateEl.textContent = formatDate(msg.timestamp);
                    container.appendChild(dateEl);
                    lastDate = messageDate;
                }
                
                const isOutgoing = msg.senderId === currentUser.id;
                const sender = allUsers[msg.senderId];
                
                const prevMessage = messages[index - 1];
                const showAvatar = !prevMessage || prevMessage.senderId !== msg.senderId || 
                                 (msg.timestamp - prevMessage.timestamp) > 300000;
                
                const messageEl = document.createElement('div');
                messageEl.className = `message ${isOutgoing ? 'message-outgoing' : 'message-incoming'}`;
                
                const time = formatTime(msg.timestamp);
                
                messageEl.innerHTML = `
                    ${!isOutgoing && showAvatar ? `
                        <div style="display: flex; align-items: flex-end; gap: 8px;">
                            <div class="user-avatar" style="width: 32px; height: 32px; font-size: 0.9rem; background: linear-gradient(135deg, ${sender.color} 0%, ${sender.color}99 100%);">
                                ${sender.avatar}
                            </div>
                            <div>
                                <div class="message-bubble">${escapeHtml(msg.text)}</div>
                                <div class="message-time">${time}</div>
                            </div>
                        </div>
                    ` : `
                        <div>
                            <div class="message-bubble">${escapeHtml(msg.text)}</div>
                            <div class="message-time">${time}</div>
                        </div>
                    `}
                `;
                
                container.appendChild(messageEl);
            });
            
            setTimeout(() => {
                container.scrollTop = container.scrollHeight;
            }, 100);
        }
        
        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            
            if (!text || !currentChat || !currentContact) return;
            
            const message = {
                id: 'msg_' + Date.now(),
                senderId: currentUser.id,
                text: text,
                timestamp: Date.now(),
                read: false
            };
            
            if (!allMessages[currentChat]) {
                allMessages[currentChat] = [];
            }
            allMessages[currentChat].push(message);
            
            allUsers[currentUser.id].lastSeen = Date.now();
            
            saveData();
            
            input.value = '';
            input.style.height = 'auto';
            document.getElementById('btn-send').disabled = true;
            
            renderMessages();
            renderContacts();
            
            // Уведомление для другого пользователя
            if (currentContact.status === 'online') {
                showNewMessageNotification(currentContact.name, text, currentContact.avatar);
            }
            
            // Эмуляция ответа
            if (Math.random() > 0.3 && currentContact.status === 'online') {
                setTimeout(() => {
                    const responses = [
                        'Привет! Как дела?',
                        'Интересно...',
                        'Я тоже об этом думал!',
                        'Согласен с тобой',
                        'Спасибо за сообщение!',
                        'Давай обсудим это подробнее',
                        'Хорошо 👍',
                        'Отлично!'
                    ];
                    
                    const response = responses[Math.floor(Math.random() * responses.length)];
                    
                    const replyMessage = {
                        id: 'msg_' + Date.now(),
                        senderId: currentContact.id,
                        text: response,
                        timestamp: Date.now(),
                        read: false
                    };
                    
                    allMessages[currentChat].push(replyMessage);
                    saveData();
                    
                    if (!document.getElementById('chat-screen').classList.contains('active') || 
                        currentChat !== getChatId(currentUser.id, currentContact.id)) {
                        showNewMessageNotification(currentContact.name, response, currentContact.avatar);
                    }
                    
                    renderMessages();
                    renderContacts();
                }, 1000 + Math.random() * 2000);
            }
        }
        
        function markMessagesAsRead() {
            if (allMessages[currentChat]) {
                allMessages[currentChat].forEach(msg => {
                    if (msg.senderId !== currentUser.id) {
                        msg.read = true;
                    }
                });
                saveData();
            }
        }
        
        // ==================== ЗВОНКИ ====================
        function startCall() {
            if (!currentContact) return;
            
            callData.isInitiator = true;
            callData.callId = 'call_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            
            // Создаем событие звонка
            const callEvent = {
                id: callData.callId,
                type: 'incoming',
                from: currentUser.id,
                to: currentContact.id,
                timestamp: Date.now()
            };
            
            localStorage.setItem(CALL_EVENTS_KEY, JSON.stringify(callEvent));
            
            // Показываем экран звонка
            showCallScreen();
            
            // Запускаем звонок через WebRTC (эмуляция для демо)
            simulateCall();
        }
        
        function showCallScreen() {
            document.getElementById('call-avatar').textContent = currentContact.avatar;
            document.getElementById('call-avatar').style.background = `linear-gradient(135deg, ${currentContact.color} 0%, ${currentContact.color}99 100%)`;
            document.getElementById('call-name').textContent = currentContact.name;
            document.getElementById('call-status').textContent = callData.isInitiator ? 'Звонок...' : 'Входящий звонок...';
            
            document.getElementById('call-screen').classList.add('active');
            
            if (callData.isInitiator) {
                startCallTimer();
            }
        }
        
        function simulateCall() {
            // Эмуляция звонка - в реальном приложении здесь был бы WebRTC
            setTimeout(() => {
                if (callData.callId) {
                    document.getElementById('call-status').textContent = 'Звонок установлен';
                    
                    // Показываем видео элементы
                    const remoteVideo = document.getElementById('remoteVideo');
                    const localVideo = document.getElementById('localVideo');
                    
                    // Эмуляция видео потоков
                    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                        navigator.mediaDevices.getUserMedia({ 
                            video: true, 
                            audio: true 
                        }).then(stream => {
                            localVideo.srcObject = stream;
                            callData.localStream = stream;
                            
                            // Эмулируем удаленное видео (заглушка)
                            setTimeout(() => {
                                document.getElementById('call-status').textContent = 'Разговор';
                            }, 1000);
                        }).catch(err => {
                            console.log('Ошибка доступа к камере:', err);
                            document.getElementById('call-status').textContent = 'Звонок (без видео)';
                        });
                    }
                }
            }, 2000);
        }
        
        function startCallTimer() {
            callData.callStartTime = Date.now();
            callData.callTimer = setInterval(updateCallTimer, 1000);
        }
        
        function updateCallTimer() {
            if (!callData.callStartTime) return;
            
            const elapsed = Math.floor((Date.now() - callData.callStartTime) / 1000);
            const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
            const seconds = (elapsed % 60).toString().padStart(2, '0');
            
            document.getElementById('call-timer').textContent = `${minutes}:${seconds}`;
        }
        
        function endCall() {
            // Очищаем таймер
            if (callData.callTimer) {
                clearInterval(callData.callTimer);
                callData.callTimer = null;
            }
            
            // Останавливаем медиапотоки
            if (callData.localStream) {
                callData.localStream.getTracks().forEach(track => track.stop());
                callData.localStream = null;
            }
            
            // Скрываем экран звонка
            document.getElementById('call-screen').classList.remove('active');
            document.getElementById('incoming-call').classList.remove('active');
            
            // Создаем событие завершения звонка
            if (callData.callId) {
                const callEvent = {
                    id: callData.callId,
                    type: 'ended',
                    timestamp: Date.now()
                };
                localStorage.setItem(CALL_EVENTS_KEY, JSON.stringify(callEvent));
            }
            
            // Сбрасываем данные звонка
            callData = {
                isInitiator: false,
                callId: null,
                peerConnection: null,
                localStream: null,
                callTimer: null,
                callStartTime: null,
                isMuted: false,
                isVideoOff: false
            };
            
            showNotification('Звонок завершен');
        }
        
        function handleCallEvent() {
            const callEventStr = localStorage.getItem(CALL_EVENTS_KEY);
            if (!callEventStr) return;
            
            const callEvent = JSON.parse(callEventStr);
            
            // Проверяем, адресован ли звонок текущему пользователю
            if (callEvent.type === 'incoming' && callEvent.to === currentUser.id) {
                showIncomingCall(callEvent);
            }
            
            // Если звонок завершен, скрываем экран
            if (callEvent.type === 'ended') {
                if (document.getElementById('call-screen').classList.contains('active')) {
                    endCall();
                }
            }
        }
        
        function showIncomingCall(callEvent) {
            const caller = allUsers[callEvent.from];
            if (!caller) return;
            
            document.getElementById('incoming-avatar').textContent = caller.avatar;
            document.getElementById('incoming-avatar').style.background = `linear-gradient(135deg, ${caller.color} 0%, ${caller.color}99 100%)`;
            document.getElementById('incoming-name').textContent = caller.name;
            document.getElementById('incoming-status').textContent = 'Входящий звонок...';
            
            document.getElementById('incoming-call').classList.add('active');
            
            // Автоотклонение через 30 секунд
            setTimeout(() => {
                if (document.getElementById('incoming-call').classList.contains('active')) {
                    declineCall();
                }
            }, 30000);
        }
        
        function acceptCall() {
            const callEventStr = localStorage.getItem(CALL_EVENTS_KEY);
            if (!callEventStr) return;
            
            const callEvent = JSON.parse(callEventStr);
            
            // Обновляем данные звонка
            callData.isInitiator = false;
            callData.callId = callEvent.id;
            
            // Скрываем окно входящего звонка
            document.getElementById('incoming-call').classList.remove('active');
            
            // Показываем экран звонка
            showCallScreen();
            startCallTimer();
            
            // Эмулируем принятие звонка
            const acceptEvent = {
                ...callEvent,
                type: 'accepted',
                timestamp: Date.now()
            };
            localStorage.setItem(CALL_EVENTS_KEY, JSON.stringify(acceptEvent));
            
            // Запускаем звонок
            setTimeout(() => {
                simulateCall();
            }, 1000);
        }
        
        function declineCall() {
            const callEventStr = localStorage.getItem(CALL_EVENTS_KEY);
            if (callEventStr) {
                const callEvent = JSON.parse(callEventStr);
                const declineEvent = {
                    ...callEvent,
                    type: 'declined',
                    timestamp: Date.now()
                };
                localStorage.setItem(CALL_EVENTS_KEY, JSON.stringify(declineEvent));
            }
            
            document.getElementById('incoming-call').classList.remove('active');
            showNotification('Звонок отклонен');
        }
        
        // ==================== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ====================
        function getChatId(user1Id, user2Id) {
            return [user1Id, user2Id].sort().join('_');
        }
        
        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        
        function formatDate(timestamp) {
            const date = new Date(timestamp);
            const today = new Date();
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            
            if (date.toDateString() === today.toDateString()) {
                return 'Сегодня';
            } else if (date.toDateString() === yesterday.toDateString()) {
                return 'Вчера';
            } else {
                return date.toLocaleDateString('ru-RU', { 
                    day: 'numeric', 
                    month: 'long' 
                });
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function showNotification(text, type = 'info') {
            const notification = document.getElementById('notification');
            const title = document.getElementById('notification-title');
            const textEl = document.getElementById('notification-text');
            const avatar = document.getElementById('notification-avatar');
            
            title.textContent = type === 'error' ? 'Ошибка' : 'Уведомление';
            textEl.textContent = text;
            avatar.textContent = currentUser?.avatar || '!';
            
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
        
        function showNewMessageNotification(senderName, message, senderAvatar) {
            const notification = document.getElementById('notification');
            const title = document.getElementById('notification-title');
            const textEl = document.getElementById('notification-text');
            const avatar = document.getElementById('notification-avatar');
            
            title.textContent = senderName;
            textEl.textContent = message.length > 30 ? message.substring(0, 30) + '...' : message;
            avatar.textContent = senderAvatar;
            
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
        
        function showError(text) {
            showNotification(text, 'error');
        }
        
        // ==================== ОБРАБОТЧИКИ СОБЫТИЙ ====================
        function setupEventListeners() {
            // Вход
            document.getElementById('btn-login').addEventListener('click', login);
            
            document.getElementById('username').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') login();
            });
            
            // Обновление
            document.getElementById('btn-refresh').addEventListener('click', () => {
                loadData();
                renderContacts();
                showNotification('Контакты обновлены');
            });
            
            // Новый чат
            document.getElementById('btn-new-chat').addEventListener('click', () => {
                // Открываем чат с первым контактом
                const otherUsers = Object.values(allUsers).filter(u => u.id !== currentUser.id);
                if (otherUsers.length > 0) {
                    openChat(otherUsers[0]);
                }
            });
            
            // Выход
            document.getElementById('btn-logout').addEventListener('click', logout);
            
            // Назад из чата
            document.getElementById('btn-back').addEventListener('click', () => {
                document.getElementById('chat-screen').classList.remove('active');
                currentChat = null;
                currentContact = null;
                renderContacts();
            });
            
            // Отправка сообщения
            document.getElementById('btn-send').addEventListener('click', sendMessage);
            
            // Ввод сообщения
            const messageInput = document.getElementById('message-input');
            messageInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
                document.getElementById('btn-send').disabled = this.value.trim() === '';
            });
            
            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            
            // Звонок из чата
            document.getElementById('btn-call').addEventListener('click', startCall);
            
            // Управление звонком
            document.getElementById('btn-end-call').addEventListener('click', endCall);
            
            document.getElementById('btn-mute').addEventListener('click', function() {
                callData.isMuted = !callData.isMuted;
                this.classList.toggle('muted', callData.isMuted);
                
                if (callData.localStream) {
                    callData.localStream.getAudioTracks().forEach(track => {
                        track.enabled = !callData.isMuted;
                    });
                }
                
                showNotification(callData.isMuted ? 'Микрофон выключен' : 'Микрофон включен');
            });
            
            document.getElementById('btn-video').addEventListener('click', function() {
                callData.isVideoOff = !callData.isVideoOff;
                this.classList.toggle('muted', callData.isVideoOff);
                
                if (callData.localStream) {
                    callData.localStream.getVideoTracks().forEach(track => {
                        track.enabled = !callData.isVideoOff;
                    });
                }
                
                document.getElementById('localVideo').style.display = callData.isVideoOff ? 'none' : 'block';
                showNotification(callData.isVideoOff ? 'Камера выключена' : 'Камера включена');
            });
            
            // Входящий звонок
            document.getElementById('btn-accept-call').addEventListener('click', acceptCall);
            document.getElementById('btn-decline-call').addEventListener('click', declineCall);
        }
        
        // Запуск приложения
        document.addEventListener('DOMContentLoaded', initApp);
        
        // Добавляем стили для анимаций
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideInRight {
                from {
                    transform: translateX(100%);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }
            
            @keyframes slideOutRight {
                from {
                    transform: translateX(0);
                    opacity: 1;
                }
                to {
                    transform: translateX(100%);
                    opacity: 0;
                }
            }
            
            .notification.show {
                animation: slideInRight 0.3s ease forwards;
            }
            
            .notification:not(.show) {
                animation: slideOutRight 0.3s ease forwards;
            }
            
            .system-message {
                text-align: center;
                color: var(--text-muted);
                font-size: 0.9rem;
                margin: 16px 0;
                position: relative;
            }
            
            .system-message:before {
                content: '';
                position: absolute;
                left: 0;
                top: 50%;
                width: 100%;
                height: 1px;
                background: var(--border);
                z-index: -1;
            }
            
            .system-message span {
                background: var(--bg);
                padding: 0 12px;
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
