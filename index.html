<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Messenger | Рабочие звонки и чат</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6d72f5;
            --primary-dark: #575cd6;
            --secondary: #2dd4bf;
            --danger: #ef4444;
            --success: #10b981;
            --bg: #0a0a0f;
            --surface: #151520;
            --surface-light: #1e1e2d;
            --text: #ffffff;
            --text-muted: #a0a0c0;
            --border: #2a2a3d;
            --radius: 12px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.4;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Auth Screen */
        .auth-screen {
            background: linear-gradient(135deg, var(--bg) 0%, #151525 100%);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }

        .logo {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .app-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .app-subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 30px;
        }

        .login-box {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            text-align: left;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
        }

        .btn {
            padding: 14px;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .user-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .user-option {
            padding: 12px;
            background: var(--surface-light);
            border-radius: 8px;
            border: 2px solid transparent;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-option.active {
            border-color: var(--primary);
            background: var(--surface);
        }

        .user-avatar-small {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        /* Main Screen */
        .main-screen {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .main-screen.active {
            display: flex;
        }

        /* Header */
        .header {
            background: var(--surface);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .user-details .name {
            font-weight: 600;
            font-size: 1rem;
        }

        .user-details .status {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--surface-light);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Contacts */
        .contacts {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }

        .contact {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }

        .contact:hover {
            background: var(--surface);
        }

        .contact.active {
            background: var(--surface);
            border-left: 3px solid var(--primary);
        }

        .contact-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            position: relative;
        }

        .contact-status {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success);
            border: 2px solid var(--surface);
        }

        .contact-status.offline {
            background: var(--text-muted);
        }

        .contact-details {
            flex: 1;
        }

        .contact-name {
            font-weight: 600;
            margin-bottom: 3px;
        }

        .contact-last-msg {
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }

        /* Chat Screen */
        .chat-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            display: none;
            flex-direction: column;
            z-index: 1000;
        }

        .chat-screen.active {
            display: flex;
        }

        .chat-header {
            background: var(--surface);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid var(--border);
        }

        .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--surface-light);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 80%;
            padding: 10px;
            border-radius: 15px;
            position: relative;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.received {
            background: var(--surface);
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }

        .message.sent {
            background: var(--primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }

        .message-text {
            word-wrap: break-word;
        }

        .message-time {
            font-size: 0.7rem;
            opacity: 0.7;
            text-align: right;
            margin-top: 5px;
        }

        .chat-input-area {
            padding: 15px 20px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .message-input {
            flex: 1;
            padding: 12px 15px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text);
            font-size: 1rem;
            resize: none;
            max-height: 100px;
            min-height: 40px;
        }

        .send-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Call Screen */
        .call-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: none;
            flex-direction: column;
            z-index: 2000;
        }

        .call-screen.active {
            display: flex;
        }

        .call-header {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .call-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .call-status {
            font-size: 1rem;
        }

        .call-timer {
            font-family: monospace;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .video-container {
            flex: 1;
            position: relative;
            background: #000;
        }

        .remote-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: var(--surface);
        }

        .local-video {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 100px;
            height: 150px;
            border-radius: 10px;
            border: 2px solid white;
            object-fit: cover;
            background: var(--surface);
        }

        .call-controls {
            padding: 20px;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .call-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--surface);
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .call-btn.end-call {
            background: var(--danger);
        }

        .call-btn.active {
            background: var(--success);
        }

        /* Incoming Call */
        .incoming-call {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            color: white;
            text-align: center;
        }

        .incoming-call.active {
            display: flex;
        }

        .incoming-caller {
            margin-bottom: 30px;
        }

        .incoming-name {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 10px 0;
        }

        .incoming-status {
            font-size: 1rem;
            opacity: 0.8;
        }

        .call-actions {
            display: flex;
            gap: 30px;
        }

        .accept-call, .decline-call {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .accept-call {
            background: var(--success);
        }

        .decline-call {
            background: var(--danger);
        }

        /* Notification */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 15px;
            max-width: 300px;
            z-index: 4000;
            animation: slideIn 0.3s, slideOut 0.3s 2.7s;
            box-shadow: var(--shadow);
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }

        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
        }

        .loading:before {
            content: '';
            width: 20px;
            height: 20px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Авторизация -->
        <div class="auth-screen" id="authScreen">
            <div class="logo">
                <i class="fas fa-comments"></i>
            </div>
            <h1 class="app-title">Real Messenger</h1>
            <p class="app-subtitle">Рабочие звонки и сообщения</p>
            
            <div class="login-box">
                <div class="form-group">
                    <label class="form-label">Ваше имя</label>
                    <input type="text" class="form-input" id="username" placeholder="Введите имя">
                </div>
                
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px;">
                    Выберите аккаунт:
                </p>
                
                <div class="user-options" id="userOptions">
                    <!-- Загружается динамически -->
                </div>
                
                <button class="btn btn-primary" id="loginBtn" style="margin-top: 20px;">
                    <i class="fas fa-sign-in-alt"></i> Войти
                </button>
                
                <p style="color: var(--text-muted); font-size: 0.8rem; margin-top: 15px;">
                    Для тестирования откройте две вкладки с разными аккаунтами
                </p>
            </div>
        </div>

        <!-- Основной экран -->
        <div class="main-screen" id="mainScreen">
            <!-- Шапка -->
            <div class="header">
                <div class="user-info">
                    <div class="user-avatar" id="currentUserAvatar">А</div>
                    <div class="user-details">
                        <div class="name" id="currentUserName">Алексей</div>
                        <div class="status" id="currentUserStatus">В сети</div>
                    </div>
                </div>
                
                <div class="header-actions">
                    <div class="icon-btn" id="refreshBtn">
                        <i class="fas fa-sync-alt"></i>
                    </div>
                    <div class="icon-btn" id="logoutBtn">
                        <i class="fas fa-sign-out-alt"></i>
                    </div>
                </div>
            </div>

            <!-- Контакты -->
            <div class="contacts" id="contactsList">
                <!-- Загружается динамически -->
            </div>
        </div>

        <!-- Экран чата -->
        <div class="chat-screen" id="chatScreen">
            <div class="chat-header">
                <div class="back-btn" id="backBtn">
                    <i class="fas fa-arrow-left"></i>
                </div>
                <div class="user-avatar" id="chatAvatar">М</div>
                <div style="flex: 1;">
                    <div class="name" id="chatName">Мария</div>
                    <div class="status" id="chatStatus">В сети</div>
                </div>
                <div class="icon-btn" id="callBtn">
                    <i class="fas fa-phone"></i>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <!-- Сообщения загружаются динамически -->
            </div>

            <div class="chat-input-area">
                <textarea 
                    class="message-input" 
                    id="messageInput"
                    placeholder="Напишите сообщение..."
                    rows="1"
                ></textarea>
                <button class="send-btn" id="sendBtn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>

        <!-- Экран звонка -->
        <div class="call-screen" id="callScreen">
            <div class="call-header">
                <div class="call-info">
                    <div class="user-avatar" id="callAvatar">М</div>
                    <div>
                        <div class="name" id="callName">Мария</div>
                        <div class="call-status" id="callStatus">Идет звонок...</div>
                    </div>
                </div>
                <div class="call-timer" id="callTimer">00:00</div>
            </div>
            
            <div class="video-container">
                <video id="remoteVideo" class="remote-video" autoplay playsinline></video>
                <video id="localVideo" class="local-video" autoplay playsinline muted></video>
            </div>
            
            <div class="call-controls">
                <button class="call-btn" id="muteBtn">
                    <i class="fas fa-microphone"></i>
                </button>
                <button class="call-btn" id="videoBtn">
                    <i class="fas fa-video"></i>
                </button>
                <button class="call-btn end-call" id="endCallBtn">
                    <i class="fas fa-phone-slash"></i>
                </button>
            </div>
        </div>

        <!-- Входящий звонок -->
        <div class="incoming-call" id="incomingCall">
            <div class="user-avatar" style="width: 80px; height: 80px; font-size: 2rem;" id="incomingAvatar">М</div>
            <div class="incoming-caller">
                <div class="incoming-name" id="incomingName">Мария</div>
                <div class="incoming-status" id="incomingStatus">Входящий звонок...</div>
            </div>
            
            <div class="call-actions">
                <div class="accept-call" id="acceptCallBtn">
                    <i class="fas fa-phone"></i>
                </div>
                <div class="decline-call" id="declineCallBtn">
                    <i class="fas fa-phone-slash"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Уведомление -->
    <div class="notification" id="notification" style="display: none;">
        <div style="display: flex; align-items: center; gap: 10px;">
            <div class="user-avatar" style="width: 30px; height: 30px; font-size: 0.9rem;" id="notifAvatar">А</div>
            <div>
                <div style="font-weight: 600; font-size: 0.9rem;" id="notifTitle">Новое сообщение</div>
                <div style="font-size: 0.8rem; color: var(--text-muted);" id="notifText">От Алексей</div>
            </div>
        </div>
    </div>

    <script>
        // ==================== СИСТЕМА ДАННЫХ ====================
        const STORAGE_KEY = 'realmessenger_data';
        const CALLS_KEY = 'realmessenger_calls';
        const USERS_KEY = 'realmessenger_users';
        
        let currentUser = null;
        let currentChatUser = null;
        let messages = {};
        let contacts = [];
        let callData = {
            callId: null,
            isCaller: false,
            callTimer: null,
            callStartTime: null,
            localStream: null,
            peerConnection: null,
            dataChannel: null,
            isMuted: false,
            isVideoOff: false
        };
        
        // Инициализация пользователей
        function initUsers() {
            const users = [
                {
                    id: 'user1',
                    name: 'Алексей',
                    avatar: 'А',
                    color: '#6d72f5',
                    status: 'online',
                    lastSeen: Date.now()
                },
                {
                    id: 'user2',
                    name: 'Мария',
                    avatar: 'М',
                    color: '#f472b6',
                    status: 'online',
                    lastSeen: Date.now()
                },
                {
                    id: 'user3',
                    name: 'Дмитрий',
                    avatar: 'Д',
                    color: '#2dd4bf',
                    status: 'offline',
                    lastSeen: Date.now() - 3600000
                },
                {
                    id: 'user4',
                    name: 'Елена',
                    avatar: 'Е',
                    color: '#f59e0b',
                    status: 'online',
                    lastSeen: Date.now()
                }
            ];
            
            localStorage.setItem(USERS_KEY, JSON.stringify(users));
            return users;
        }
        
        // Получение всех пользователей
        function getAllUsers() {
            const users = localStorage.getItem(USERS_KEY);
            return users ? JSON.parse(users) : initUsers();
        }
        
        // Обновление пользователя
        function updateUser(userId, updates) {
            const users = getAllUsers();
            const index = users.findIndex(u => u.id === userId);
            if (index !== -1) {
                users[index] = { ...users[index], ...updates };
                localStorage.setItem(USERS_KEY, JSON.stringify(users));
            }
        }
        
        // Загрузка данных
        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const data = JSON.parse(saved);
                messages = data.messages || {};
                contacts = data.contacts || getAllUsers().filter(u => u.id !== currentUser?.id);
            } else {
                messages = {};
                contacts = getAllUsers().filter(u => u.id !== currentUser?.id);
                saveData();
            }
        }
        
        // Сохранение данных
        function saveData() {
            const data = {
                messages,
                contacts,
                lastUpdate: Date.now()
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            
            // Триггер для других вкладок
            window.dispatchEvent(new Event('storageUpdate'));
        }
        
        // Синхронизация между вкладками
        function setupSync() {
            window.addEventListener('storage', (e) => {
                if (e.key === STORAGE_KEY) {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        const data = JSON.parse(saved);
                        messages = data.messages || {};
                        contacts = data.contacts || [];
                        
                        if (currentUser) {
                            updateContacts();
                            if (currentChatUser) {
                                renderMessages();
                            }
                        }
                    }
                }
                if (e.key === CALLS_KEY) {
                    handleCallEvent();
                }
            });
            
            window.addEventListener('storageUpdate', () => {
                loadData();
                if (currentUser) {
                    updateContacts();
                    if (currentChatUser) {
                        renderMessages();
                    }
                }
            });
            
            // Периодическая синхронизация
            setInterval(() => {
                if (currentUser) {
                    updateUserStatus();
                }
            }, 5000);
        }
        
        // ==================== АВТОРИЗАЦИЯ ====================
        function initAuth() {
            const users = getAllUsers();
            const container = document.getElementById('userOptions');
            container.innerHTML = '';
            
            users.forEach(user => {
                const div = document.createElement('div');
                div.className = 'user-option';
                div.dataset.userId = user.id;
                
                div.innerHTML = `
                    <div class="user-avatar-small" style="background: ${user.color}">
                        ${user.avatar}
                    </div>
                    <div>
                        <div style="font-weight: 600;">${user.name}</div>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">${user.id}</div>
                    </div>
                `;
                
                div.addEventListener('click', function() {
                    document.querySelectorAll('.user-option').forEach(o => o.classList.remove('active'));
                    this.classList.add('active');
                    document.getElementById('username').value = user.name;
                });
                
                container.appendChild(div);
            });
            
            // Выбрать первого пользователя по умолчанию
            const firstOption = document.querySelector('.user-option');
            if (firstOption) {
                firstOption.click();
            }
        }
        
        function login() {
            const selected = document.querySelector('.user-option.active');
            if (!selected) {
                showNotification('Выберите аккаунт', 'error');
                return;
            }
            
            const username = document.getElementById('username').value.trim();
            const userId = selected.dataset.userId;
            const users = getAllUsers();
            const user = users.find(u => u.id === userId);
            
            if (!user) {
                showNotification('Ошибка выбора пользователя', 'error');
                return;
            }
            
            currentUser = {
                ...user,
                name: username || user.name,
                lastSeen: Date.now(),
                status: 'online'
            };
            
            updateUser(currentUser.id, {
                name: currentUser.name,
                lastSeen: Date.now(),
                status: 'online'
            });
            
            localStorage.setItem('current_user', JSON.stringify(currentUser));
            
            loadData();
            showMainScreen();
            showNotification(`Добро пожаловать, ${currentUser.name}!`);
        }
        
        function logout() {
            if (currentUser) {
                updateUser(currentUser.id, { status: 'offline' });
            }
            
            localStorage.removeItem('current_user');
            currentUser = null;
            currentChatUser = null;
            
            document.getElementById('mainScreen').classList.remove('active');
            document.getElementById('authScreen').style.display = 'flex';
            document.getElementById('chatScreen').classList.remove('active');
            
            showNotification('Вы вышли из системы');
        }
        
        function showMainScreen() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('mainScreen').classList.add('active');
            
            document.getElementById('currentUserAvatar').textContent = currentUser.avatar;
            document.getElementById('currentUserAvatar').style.background = currentUser.color;
            document.getElementById('currentUserName').textContent = currentUser.name;
            document.getElementById('currentUserStatus').textContent = 'В сети';
            
            updateContacts();
        }
        
        // ==================== КОНТАКТЫ И ЧАТ ====================
        function updateContacts() {
            const container = document.getElementById('contactsList');
            const otherUsers = getAllUsers().filter(u => u.id !== currentUser.id);
            
            if (otherUsers.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-user-friends" style="font-size: 2rem; margin-bottom: 10px;"></i><p>Нет контактов</p></div>';
                return;
            }
            
            container.innerHTML = '';
            
            otherUsers.forEach(user => {
                const chatId = getChatId(currentUser.id, user.id);
                const chatMessages = messages[chatId] || [];
                const lastMessage = chatMessages[chatMessages.length - 1];
                const unreadCount = chatMessages.filter(m => 
                    m.senderId === user.id && !m.read
                ).length;
                
                const div = document.createElement('div');
                div.className = `contact ${currentChatUser?.id === user.id ? 'active' : ''}`;
                div.dataset.userId = user.id;
                
                const lastMsgText = lastMessage ? 
                    (lastMessage.senderId === currentUser.id ? `Вы: ${lastMessage.text}` : lastMessage.text) : 
                    'Нет сообщений';
                
                div.innerHTML = `
                    <div class="contact-avatar" style="background: ${user.color}">
                        ${user.avatar}
                        <div class="contact-status ${user.status === 'online' ? '' : 'offline'}"></div>
                    </div>
                    <div class="contact-details">
                        <div style="display: flex; justify-content: space-between;">
                            <div class="contact-name">${user.name}</div>
                            ${lastMessage ? `<div style="font-size: 0.7rem; color: var(--text-muted);">${formatTime(lastMessage.timestamp)}</div>` : ''}
                        </div>
                        <div class="contact-last-msg">${lastMsgText}</div>
                    </div>
                    ${unreadCount > 0 ? `<div style="background: var(--primary); color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 10px;">${unreadCount}</div>` : ''}
                `;
                
                div.addEventListener('click', () => openChat(user));
                container.appendChild(div);
            });
        }
        
        function openChat(user) {
            currentChatUser = user;
            
            document.getElementById('chatAvatar').textContent = user.avatar;
            document.getElementById('chatAvatar').style.background = user.color;
            document.getElementById('chatName').textContent = user.name;
            document.getElementById('chatStatus').textContent = user.status === 'online' ? 'В сети' : 'Не в сети';
            
            document.getElementById('chatScreen').classList.add('active');
            document.getElementById('messageInput').focus();
            
            markMessagesAsRead();
            renderMessages();
            updateContacts();
        }
        
        function renderMessages() {
            if (!currentChatUser) return;
            
            const container = document.getElementById('chatMessages');
            const chatId = getChatId(currentUser.id, currentChatUser.id);
            const chatMessages = messages[chatId] || [];
            
            container.innerHTML = '';
            
            if (chatMessages.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-comments" style="font-size: 2rem; margin-bottom: 10px;"></i><p>Начните общение</p></div>';
                return;
            }
            
            chatMessages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.senderId === currentUser.id ? 'sent' : 'received'}`;
                
                const time = formatTime(msg.timestamp);
                
                div.innerHTML = `
                    <div class="message-text">${escapeHtml(msg.text)}</div>
                    <div class="message-time">${time}</div>
                `;
                
                container.appendChild(div);
            });
            
            setTimeout(() => {
                container.scrollTop = container.scrollHeight;
            }, 100);
        }
        
        function sendMessage() {
            if (!currentChatUser) return;
            
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!text) return;
            
            const chatId = getChatId(currentUser.id, currentChatUser.id);
            const message = {
                id: 'msg_' + Date.now(),
                senderId: currentUser.id,
                text: text,
                timestamp: Date.now(),
                read: false
            };
            
            if (!messages[chatId]) {
                messages[chatId] = [];
            }
            
            messages[chatId].push(message);
            saveData();
            
            input.value = '';
            input.style.height = 'auto';
            
            renderMessages();
            updateContacts();
            
            // Эмуляция ответа
            if (currentChatUser.status === 'online' && Math.random() > 0.5) {
                setTimeout(() => {
                    const responses = [
                        'Привет!',
                        'Как дела?',
                        'Интересно!',
                        'Согласен',
                        'Давай обсудим',
                        'Хорошо! 👍'
                    ];
                    
                    const response = responses[Math.floor(Math.random() * responses.length)];
                    
                    const reply = {
                        id: 'msg_' + Date.now(),
                        senderId: currentChatUser.id,
                        text: response,
                        timestamp: Date.now(),
                        read: false
                    };
                    
                    messages[chatId].push(reply);
                    saveData();
                    
                    if (!document.getElementById('chatScreen').classList.contains('active')) {
                        showMessageNotification(currentChatUser.name, response, currentChatUser.avatar);
                    }
                    
                    renderMessages();
                    updateContacts();
                }, 1000 + Math.random() * 2000);
            }
        }
        
        function markMessagesAsRead() {
            if (!currentChatUser) return;
            
            const chatId = getChatId(currentUser.id, currentChatUser.id);
            const chatMessages = messages[chatId] || [];
            
            chatMessages.forEach(msg => {
                if (msg.senderId === currentChatUser.id) {
                    msg.read = true;
                }
            });
            
            saveData();
        }
        
        // ==================== ЗВОНКИ ====================
        function startCall() {
            if (!currentChatUser) return;
            
            callData.isCaller = true;
            callData.callId = 'call_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            
            // Запускаем звонок
            initiateCall();
            
            // Показываем экран звонка
            showCallScreen();
            
            // Отправляем событие звонка
            const callEvent = {
                type: 'incoming',
                callId: callData.callId,
                from: currentUser.id,
                to: currentChatUser.id,
                timestamp: Date.now()
            };
            
            localStorage.setItem(CALLS_KEY, JSON.stringify(callEvent));
            setTimeout(() => localStorage.removeItem(CALLS_KEY), 100);
        }
        
        function initiateCall() {
            // Получаем доступ к камере и микрофону
            navigator.mediaDevices.getUserMedia({
                video: true,
                audio: true
            }).then(stream => {
                callData.localStream = stream;
                
                // Показываем локальное видео
                const localVideo = document.getElementById('localVideo');
                localVideo.srcObject = stream;
                
                // Создаем WebRTC соединение
                setupWebRTC();
                
                // Запускаем таймер
                startCallTimer();
                
                document.getElementById('callStatus').textContent = 'Звонок...';
                
            }).catch(err => {
                console.error('Ошибка доступа к медиа:', err);
                showNotification('Не удалось получить доступ к камере/микрофону', 'error');
                endCall();
            });
        }
        
        function setupWebRTC() {
            // Эмуляция WebRTC соединения
            // В реальном приложении здесь был бы обмен SDP/ICE кандидатами через сервер
            
            callData.peerConnection = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
            });
            
            // Добавляем локальный поток
            callData.localStream.getTracks().forEach(track => {
                callData.peerConnection.addTrack(track, callData.localStream);
            });
            
            // Создаем DataChannel для обмена сообщениями
            callData.dataChannel = callData.peerConnection.createDataChannel('chat');
            callData.dataChannel.onmessage = handleDataMessage;
            
            // Генерируем offer
            callData.peerConnection.createOffer()
                .then(offer => callData.peerConnection.setLocalDescription(offer))
                .then(() => {
                    // В реальном приложении здесь offer отправлялся бы другому пользователю
                    console.log('Offer создан');
                })
                .catch(err => console.error('Ошибка создания offer:', err));
        }
        
        function showCallScreen() {
            document.getElementById('callAvatar').textContent = currentChatUser.avatar;
            document.getElementById('callAvatar').style.background = currentChatUser.color;
            document.getElementById('callName').textContent = currentChatUser.name;
            document.getElementById('callStatus').textContent = callData.isCaller ? 'Звонок...' : 'Входящий звонок...';
            
            document.getElementById('callScreen').classList.add('active');
        }
        
        function startCallTimer() {
            callData.callStartTime = Date.now();
            callData.callTimer = setInterval(updateCallTimer, 1000);
        }
        
        function updateCallTimer() {
            if (!callData.callStartTime) return;
            
            const elapsed = Math.floor((Date.now() - callData.callStartTime) / 1000);
            const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
            const seconds = (elapsed % 60).toString().padStart(2, '0');
            
            document.getElementById('callTimer').textContent = `${minutes}:${seconds}`;
        }
        
        function endCall() {
            // Останавливаем таймер
            if (callData.callTimer) {
                clearInterval(callData.callTimer);
                callData.callTimer = null;
            }
            
            // Останавливаем медиапотоки
            if (callData.localStream) {
                callData.localStream.getTracks().forEach(track => track.stop());
                callData.localStream = null;
            }
            
            // Закрываем соединение
            if (callData.peerConnection) {
                callData.peerConnection.close();
                callData.peerConnection = null;
            }
            
            // Скрываем экраны
            document.getElementById('callScreen').classList.remove('active');
            document.getElementById('incomingCall').classList.remove('active');
            
            // Сбрасываем данные
            callData = {
                callId: null,
                isCaller: false,
                callTimer: null,
                callStartTime: null,
                localStream: null,
                peerConnection: null,
                dataChannel: null,
                isMuted: false,
                isVideoOff: false
            };
            
            showNotification('Звонок завершен');
        }
        
        function handleCallEvent() {
            const callEventStr = localStorage.getItem(CALLS_KEY);
            if (!callEventStr) return;
            
            const callEvent = JSON.parse(callEventStr);
            
            // Если звонок адресован текущему пользователю
            if (callEvent.type === 'incoming' && callEvent.to === currentUser.id) {
                showIncomingCall(callEvent);
            }
            
            // Если звонок завершен
            if (callEvent.type === 'ended') {
                if (document.getElementById('callScreen').classList.contains('active')) {
                    endCall();
                }
            }
        }
        
        function showIncomingCall(callEvent) {
            const caller = getAllUsers().find(u => u.id === callEvent.from);
            if (!caller) return;
            
            // Если уже в звонке, игнорируем
            if (document.getElementById('callScreen').classList.contains('active')) return;
            
            document.getElementById('incomingAvatar').textContent = caller.avatar;
            document.getElementById('incomingAvatar').style.background = caller.color;
            document.getElementById('incomingName').textContent = caller.name;
            
            document.getElementById('incomingCall').classList.add('active');
            
            // Автоотклонение через 30 секунд
            setTimeout(() => {
                if (document.getElementById('incomingCall').classList.contains('active')) {
                    declineCall();
                }
            }, 30000);
        }
        
        function acceptCall() {
            const callEventStr = localStorage.getItem(CALLS_KEY);
            if (!callEventStr) return;
            
            const callEvent = JSON.parse(callEventStr);
            
            // Находим пользователя
            const caller = getAllUsers().find(u => u.id === callEvent.from);
            if (!caller) return;
            
            currentChatUser = caller;
            callData.isCaller = false;
            callData.callId = callEvent.callId;
            
            // Скрываем входящий звонок
            document.getElementById('incomingCall').classList.remove('active');
            
            // Запускаем звонок
            initiateCall();
            showCallScreen();
            
            // Отправляем событие принятия звонка
            const acceptEvent = {
                type: 'accepted',
                callId: callData.callId,
                timestamp: Date.now()
            };
            
            localStorage.setItem(CALLS_KEY, JSON.stringify(acceptEvent));
            setTimeout(() => localStorage.removeItem(CALLS_KEY), 100);
        }
        
        function declineCall() {
            document.getElementById('incomingCall').classList.remove('active');
            
            // Отправляем событие отклонения звонка
            const declineEvent = {
                type: 'declined',
                timestamp: Date.now()
            };
            
            localStorage.setItem(CALLS_KEY, JSON.stringify(declineEvent));
            setTimeout(() => localStorage.removeItem(CALLS_KEY), 100);
            
            showNotification('Звонок отклонен');
        }
        
        function toggleMute() {
            if (!callData.localStream) return;
            
            callData.isMuted = !callData.isMuted;
            const audioTracks = callData.localStream.getAudioTracks();
            audioTracks.forEach(track => {
                track.enabled = !callData.isMuted;
            });
            
            const btn = document.getElementById('muteBtn');
            btn.classList.toggle('active', callData.isMuted);
            btn.innerHTML = callData.isMuted ? '<i class="fas fa-microphone-slash"></i>' : '<i class="fas fa-microphone"></i>';
            
            showNotification(callData.isMuted ? 'Микрофон выключен' : 'Микрофон включен');
        }
        
        function toggleVideo() {
            if (!callData.localStream) return;
            
            callData.isVideoOff = !callData.isVideoOff;
            const videoTracks = callData.localStream.getVideoTracks();
            videoTracks.forEach(track => {
                track.enabled = !callData.isVideoOff;
            });
            
            const localVideo = document.getElementById('localVideo');
            localVideo.style.display = callData.isVideoOff ? 'none' : 'block';
            
            const btn = document.getElementById('videoBtn');
            btn.classList.toggle('active', callData.isVideoOff);
            btn.innerHTML = callData.isVideoOff ? '<i class="fas fa-video-slash"></i>' : '<i class="fas fa-video"></i>';
            
            showNotification(callData.isVideoOff ? 'Камера выключена' : 'Камера включена');
        }
        
        function handleDataMessage(event) {
            const data = JSON.parse(event.data);
            console.log('Получено сообщение:', data);
        }
        
        // ==================== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ====================
        function getChatId(user1, user2) {
            return [user1, user2].sort().join('_');
        }
        
        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            
            if (diff < 60000) return 'только что';
            if (diff < 3600000) return `${Math.floor(diff / 60000)} мин назад`;
            
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        
        function escapeHtml(text) {
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
        
        function showNotification(text, type = 'info') {
            const notification = document.getElementById('notification');
            const title = document.getElementById('notifTitle');
            const textEl = document.getElementById('notifText');
            const avatar = document.getElementById('notifAvatar');
            
            title.textContent = type === 'error' ? 'Ошибка' : 'Уведомление';
            textEl.textContent = text;
            avatar.textContent = currentUser?.avatar || '!';
            avatar.style.background = currentUser?.color || '#6d72f5';
            
            notification.style.display = 'block';
            
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }
        
        function showMessageNotification(senderName, message, senderAvatar) {
            const notification = document.getElementById('notification');
            const title = document.getElementById('notifTitle');
            const textEl = document.getElementById('notifText');
            const avatar = document.getElementById('notifAvatar');
            
            title.textContent = senderName;
            textEl.textContent = message.length > 30 ? message.substring(0, 30) + '...' : message;
            avatar.textContent = senderAvatar;
            
            notification.style.display = 'block';
            
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }
        
        function updateUserStatus() {
            if (currentUser) {
                updateUser(currentUser.id, {
                    lastSeen: Date.now(),
                    status: 'online'
                });
            }
        }
        
        // ==================== ИНИЦИАЛИЗАЦИЯ ====================
        function init() {
            initAuth();
            setupSync();
            setupEventListeners();
            
            // Проверяем сохраненного пользователя
            const savedUser = localStorage.getItem('current_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                showMainScreen();
            }
        }
        
        function setupEventListeners() {
            // Вход
            document.getElementById('loginBtn').addEventListener('click', login);
            document.getElementById('username').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') login();
            });
            
            // Обновление
            document.getElementById('refreshBtn').addEventListener('click', () => {
                loadData();
                updateContacts();
                showNotification('Обновлено');
            });
            
            // Выход
            document.getElementById('logoutBtn').addEventListener('click', logout);
            
            // Назад из чата
            document.getElementById('backBtn').addEventListener('click', () => {
                document.getElementById('chatScreen').classList.remove('active');
                currentChatUser = null;
            });
            
            // Отправка сообщения
            document.getElementById('sendBtn').addEventListener('click', sendMessage);
            document.getElementById('messageInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            
            document.getElementById('messageInput').addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 100) + 'px';
            });
            
            // Звонок
            document.getElementById('callBtn').addEventListener('click', startCall);
            
            // Управление звонком
            document.getElementById('endCallBtn').addEventListener('click', endCall);
            document.getElementById('muteBtn').addEventListener('click', toggleMute);
            document.getElementById('videoBtn').addEventListener('click', toggleVideo);
            
            // Входящий звонок
            document.getElementById('acceptCallBtn').addEventListener('click', acceptCall);
            document.getElementById('declineCallBtn').addEventListener('click', declineCall);
        }
        
        // Запуск приложения
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
